aid: xrpay
name: XRPay
description: XRPay, built by Xbit Innovations, is a merchant payments platform whose
  Cashier API lets businesses create payment intents, issue refunds, receive webhooks
  and connect platform apps (XRPay Connect). The REST API at api.xrpay.it is described
  by a published OpenAPI 3.1 document and secured with bearer secret keys or Connect
  access tokens.
